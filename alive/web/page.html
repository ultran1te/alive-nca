<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="theme-color" content="{{PAPER}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='{{TISSUE_URL}}'/%3E%3C/svg%3E">
<!-- Made with alive: living cells that grow this page and heal when you cut them. -->
<style>
  :root { --paper: {{PAPER}}; --ink: {{INK}}; --tissue: {{TISSUE}}; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { height: 100%; overscroll-behavior: none; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; touch-action: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* each mark is drawn by the cells; a real link sits on top of it */
  .mark { position: fixed; border-radius: 18%; touch-action: none; -webkit-touch-callout: none; }
  .mark:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  /* if the cells cannot run, the text and the links are still here */
  body.plain canvas { display: none; }
  body.plain h1 { position: fixed; inset: 30vh 0 auto 0; width: auto; height: auto; clip-path: none; margin: 0; text-align: center; white-space: normal; font-size: clamp(2.4rem, 9vw, 7rem); font-weight: 700; letter-spacing: -.03em; color: var(--tissue); }
  body.plain nav { position: fixed; inset: calc(30vh + clamp(2.4rem, 9vw, 7rem) * 1.6) 0 auto 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 24px; }
  body.plain .mark { position: static; color: var(--ink); }
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<h1 class="sr">{{TEXT}}</h1>
<nav id="links">
{{LINKS}}</nav>
<script id="alive-config" type="application/json">{{CONFIG}}</script>
<script src="alive-core.js"></script>
<script src="alive-dish.js"></script>
<script>
(async function () {
  'use strict';
  const config = JSON.parse(document.getElementById('alive-config').textContent);
  const cv = document.getElementById('gl'), links = Array.prototype.slice.call(document.querySelectorAll('#links a'));
  const plain = function (why) {
    console.warn('showing the plain page:', why);
    links.forEach(function (a) { a.removeAttribute('style'); a.textContent = a.dataset.label; });
    document.body.classList.add('plain');
  };

  // ---------- what to grow ----------
  let layout; const cells = {};
  try {
    layout = await (await fetch('layout.json', { cache: 'no-cache' })).json();
    const names = Array.from(new Set(layout.pieces.map(function (p) { return p.cells; })));
    await Promise.all(names.map(async function (n) {
      const r = await fetch('cells/' + n + '.json', { cache: 'no-cache' });
      if (r.ok) cells[n] = await r.json(); else console.warn('no trained cells for', n);
    }));
  } catch (e) { return plain(e); }
  if (!Object.keys(cells).length) return plain('no trained cells found');

  // ---------- where everything sits: the text in the middle, the marks in a row under it ----------
  const upright = matchMedia('(max-width: 760px) and (orientation: portrait)');
  const workers = Math.max(2, Math.min(6, (navigator.hardwareConcurrency || 4) - 1));
  const GAP = 12, MGAP = 10, PAD = 3;   // in cells: text to marks, between marks, around each link
  function arrange(v) {
    const W = v.W, H = v.H, t = layout.text || { width: 0, height: 0 }, marks = layout.marks || [];
    const rowW = marks.reduce(function (s, m) { return s + m.width; }, 0) + Math.max(0, marks.length - 1) * MGAP;
    const rowH = marks.reduce(function (h, m) { return Math.max(h, m.height); }, 0);
    const stack = t.height + (marks.length ? (t.height ? GAP : 0) + rowH : 0);
    const m = Math.max(16, H * 0.06);
    const cell = Math.max(1, Math.min(W * (upright.matches ? 0.88 : 0.6) / Math.max(t.width, rowW), (H - 2 * m) / stack));
    const cols = Math.ceil(W / cell), top = (H - stack * cell) * 0.45 / cell;
    const rowTop = top + t.height + (t.height ? GAP : 0), at = [];
    let x = (cols - rowW) / 2;
    marks.forEach(function (mk) { at.push(x); x += mk.width + MGAP; });

    const orgs = [];
    layout.pieces.forEach(function (p, i) {
      let r0, c0, delay;
      if (p.group === 'mark') { const mk = marks[p.mark]; r0 = rowTop + (rowH - mk.height) / 2 + p.y; c0 = at[p.mark] + p.x; delay = 40 + p.mark * 10 + i; }
      else { r0 = top + p.y; c0 = (cols - t.width) / 2 + p.x; delay = i * 6; }
      orgs.push({ name: p.name, cells: p.cells, layer: 0, r0: r0, c0: c0, delay: delay, colony: 'c' + (i % workers), expect: p.solid });
    });
    links.forEach(function (a) {
      const k = +a.dataset.mark, mk = marks[k];
      a.style.left = (at[k] - PAD) * cell + 'px'; a.style.top = (rowTop + (rowH - mk.height) / 2 - PAD) * cell + 'px';
      a.style.width = (mk.width + 2 * PAD) * cell + 'px'; a.style.height = (mk.height + 2 * PAD) * cell + 'px';
    });
    return { layers: [{ s: cell, oy: 0 }], orgs: orgs };
  }

  try { window.__alive = AliveDish.start({ canvas: cv, cells: cells, arrange: arrange, handles: links, colors: config.colors, onFail: plain }); }
  catch (e) { plain(e); }
})();
</script>
</body>
</html>
